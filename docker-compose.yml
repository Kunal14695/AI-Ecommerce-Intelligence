version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/ecommerce_db
      - SECRET_KEY=poornima_ai_ecommerce_secret_key_change_in_production_2026
      - ALGORITHM=HS256
      - NOMINATIM_USER_AGENT=PoornimaAICommerceApp/1.0 (contact@poornima.edu.in)
      - NOMINATIM_RATE_LIMIT_DELAY=1.0
      - DEFAULT_SERVICEABLE_PINS=302022,302029,302020,302017,302001,110001,400001,560001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
